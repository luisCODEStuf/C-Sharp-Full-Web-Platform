<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Page</title>
</head>

<body>
    <header>
        <nav>
            <a href="../Dashboard/dashboard.html">DashBoard</a>
            <a href="../FilterPage/Filterpage.html">Filters </a>
            <button id="alternate-bar"><i class="fa-solid fa-bars"></i></button>
        </nav>

    </header>

    <main>
        <div id="left-container">
            
            
            <div id="filters">
                

                <label for="">Search types</label>
                <div id="Search-Filter">
                    <label for="">Id</label>
                   <input type="checkbox" id="Search-Id">

                   <label for="">Name</label>
                   <input type="checkbox" id="Search-Name">

                   <label for="">Email</label>
                   <input type="checkbox" id="Search-Email">

                   <input type="text" id="Search-Filter-ipt" placeholder="text:">
                </div>

                <label for="">Admin?</label>
                <div id="IsAdmin-filter">
                 <label for="">Admins</label>
                 <input type="checkbox" id="IsAdmin-True">

                 <label for="">Not admins</label>
                 <input type="checkbox" id="IsAdmin-False">
                </div>
                 
                <label for="">Date from/to</label>
                <div id="Date_filter">
                    <label for="">From</label>
                <input type="date" id="Filter-Date-From">

                 <label for="">to</label>
                 <input type="date" id="Filter-Date-To">
                </div>
                
                <label for="">Sorting by</label>
                <div id="SortBy-filter">
                        <label for="">Id</label>
                   <input type="checkbox" id="SortBy-Id">

                   <label for="">Name</label>
                   <input type="checkbox" id="SortBy-Name">

                   <label for="">Email</label>
                   <input type="checkbox" id="SortBy-Email">
                </div>
                
                <label for="">Ordering by</label>
                <div id="order">
                   <label for="">Asc</label>
                   <input type="checkbox" name="" id="Order-Asc">

                   <label for="">Desc</label>
                   <input type="checkbox" name="" id="Order-Desc">
                </div>
                
                <button id="filter-btn">Filter</button>
            </div>

            <div class="User-container">
                
            </div>
            
        <div class="pages">
            <button id="last-page"><</button>
            <p id="page">1</p>
            <button id="next-page">></button>
        </div>  
        </div>

        <div class="vertical-bar ">

            <label for="">Id</label>
            <input type="text" id="Id-input" placeholder="Name">

            <div id="id-separetor"></div>

            <label for="">Name</label>
            <input type="text" id="change-Name" placeholder="Name">

            <label for="">Email</label>
            <input type="email" id="change-Email" placeholder="Name">

            <label for="">Roles</label>
            <input type="text" id="change-Roles" placeholder="Name">

            <button id="Save-changes">Save changes</button>

            <p id="sucess-message"></p>
        </div>
    </main>

    <script type="module" src="../FilterPage/script.js"></script>
</body>

</html>
